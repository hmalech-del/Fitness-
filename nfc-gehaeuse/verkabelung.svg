<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="980" height="640" fill="#ffffff"/>

  <text x="40" y="46" font-size="27" font-weight="bold" fill="#1b1b1b">NFC-Reader — vier Kabel, mehr nicht</text>
  <text x="40" y="74" font-size="16" fill="#555">PN532 (rotes V3-Board)  ·  Wemos D1 Mini ESP32  ·  Verbindung über I2C</text>

  <!-- ================= PN532 ================= -->
  <rect x="60" y="110" width="255" height="310" rx="8" fill="#a8372c"/>
  <text x="76" y="136" font-size="15" font-weight="bold" fill="#ffffff">PN532  V3</text>

  <!-- DIP-Schalter -->
  <rect x="76" y="150" width="112" height="70" rx="5" fill="#f4f4f4" stroke="#6f2a21" stroke-width="2"/>
  <text x="132" y="167" font-size="11" fill="#666" text-anchor="middle">DIP-Schalter</text>
  <rect x="90" y="174" width="32" height="20" rx="2" fill="#d8d8d8" stroke="#8a8a8a"/>
  <rect x="90" y="174" width="32" height="10" rx="2" fill="#2e7d32"/>
  <text x="106" y="212" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">1 ON</text>
  <rect x="142" y="174" width="32" height="20" rx="2" fill="#d8d8d8" stroke="#8a8a8a"/>
  <rect x="142" y="184" width="32" height="10" rx="2" fill="#6e6e6e"/>
  <text x="158" y="212" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2 OFF</text>

  <!-- Antennenflaeche -->
  <rect x="76" y="240" width="180" height="164" rx="10" fill="none" stroke="#e8b5ad" stroke-width="2.5"/>
  <rect x="90" y="254" width="152" height="136" rx="8"  fill="none" stroke="#e8b5ad" stroke-width="2.5"/>
  <rect x="104" y="268" width="124" height="108" rx="6" fill="none" stroke="#e8b5ad" stroke-width="2.5"/>
  <text x="166" y="326" font-size="13" fill="#f6dedb" text-anchor="middle">Antenne</text>
  <text x="166" y="344" font-size="11" fill="#e0b0a8" text-anchor="middle">zeigt zum Fenster</text>

  <!-- ================= D1 Mini ================= -->
  <rect x="702" y="130" width="160" height="270" rx="8" fill="#243746"/>
  <text x="782" y="158" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">D1 Mini</text>
  <text x="782" y="176" font-size="13" fill="#9fb4c7" text-anchor="middle">ESP32</text>
  <rect x="754" y="400" width="56" height="20" rx="3" fill="#8d9aa6"/>
  <text x="782" y="439" font-size="12" fill="#444" text-anchor="middle">USB — zeigt zum Ausschnitt</text>

  <!-- ================= Leitungen ================= -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="315" y1="205" x2="690" y2="205" stroke="#cc2b2b"/>
    <line x1="315" y1="255" x2="690" y2="255" stroke="#232323"/>
    <line x1="315" y1="305" x2="690" y2="305" stroke="#1f6fb2"/>
    <line x1="315" y1="355" x2="690" y2="355" stroke="#c28a00"/>
  </g>
  <g fill="#e8c14a" stroke="#6b5410" stroke-width="2">
    <circle cx="315" cy="205" r="7"/><circle cx="315" cy="255" r="7"/>
    <circle cx="315" cy="305" r="7"/><circle cx="315" cy="355" r="7"/>
    <circle cx="690" cy="205" r="7"/><circle cx="690" cy="255" r="7"/>
    <circle cx="690" cy="305" r="7"/><circle cx="690" cy="355" r="7"/>
  </g>

  <!-- Pin-Beschriftung links -->
  <g font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="start">
    <text x="329" y="196">VCC</text><text x="329" y="246">GND</text>
    <text x="329" y="296">SDA</text><text x="329" y="346">SCL</text>
  </g>
  <!-- Pin-Beschriftung rechts -->
  <g font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="end">
    <text x="676" y="196">3V3</text><text x="676" y="246">GND</text>
    <text x="676" y="296">GPIO21</text><text x="676" y="346">GPIO22</text>
  </g>
  <!-- Bedeutung in der Mitte -->
  <g text-anchor="middle" font-size="14">
    <rect x="425" y="188" width="155" height="26" rx="13" fill="#ffffff" stroke="#cc2b2b" stroke-width="1.5"/>
    <text x="502" y="206" fill="#8f1d1d">Strom  3,3 V</text>
    <rect x="425" y="238" width="155" height="26" rx="13" fill="#ffffff" stroke="#232323" stroke-width="1.5"/>
    <text x="502" y="256" fill="#232323">Masse</text>
    <rect x="425" y="288" width="155" height="26" rx="13" fill="#ffffff" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="502" y="306" fill="#154c7c">Daten</text>
    <rect x="425" y="338" width="155" height="26" rx="13" fill="#ffffff" stroke="#c28a00" stroke-width="1.5"/>
    <text x="502" y="356" fill="#7d5900">Takt</text>
  </g>

  <!-- ================= Hinweise ================= -->
  <rect x="40" y="455" width="900" height="150" rx="10" fill="#f6f7f8" stroke="#d6dade" stroke-width="1.5"/>
  <text x="62" y="484" font-size="15" font-weight="bold" fill="#1b1b1b">Worauf es ankommt</text>
  <g font-size="14" fill="#333">
    <text x="62" y="512">1.  Nach der <tspan font-weight="bold">Beschriftung</tspan> stecken, nicht nach der Position — die Pinreihenfolge ist je nach Board anders.</text>
    <text x="62" y="536">2.  DIP-Schalter <tspan font-weight="bold">vor</tspan> dem Einbau setzen. Danach zeigen sie nach innen.</text>
    <text x="62" y="560">3.  <tspan font-weight="bold">IRQ</tspan> und <tspan font-weight="bold">RSTO</tspan> am PN532 bleiben frei. ESPHome fragt das Modul aktiv ab.</text>
    <text x="62" y="584">4.  Erfolgskontrolle im Log:  <tspan font-family="DejaVu Sans Mono, monospace" fill="#0a6b2e">Found i2c device at address 0x24</tspan></text>
  </g>
</svg>
